<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5f1">
    <title>Willkommen</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="login" id="loginView" aria-label="Anmeldung">
        <div class="login__intro">
          <p class="typed-message" id="typedMessage" aria-label="Hallo Alina, mir war langweilig und ich wollte ein bisschen testen und üben, daher dieses Projekt. Mit KI hättest du das auch hinbekommen. Bitte klaue nicht meinen Job."></p>
        </div>

        <form class="login__form" id="loginForm">
          <label for="username">Benutzername</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Benutzername" required>

          <label for="password">Passwort</label>
          <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="Passwort" required>

          <p class="form-error" id="loginError" role="alert" hidden>Benutzername oder Passwort ist nicht korrekt.</p>
          <button type="submit">Weiter</button>
        </form>
      </section>

      <section class="journey" id="resultView" aria-live="polite" hidden>
        <div class="journey__track" id="journeyTrack">
          <article class="place place--germany" aria-label="Deutschland, Münster">
            <div class="place__heading">
              <p class="place__kicker">Deutschland</p>
              <h2>Münster</h2>
            </div>

            <div class="map map--germany" aria-hidden="true">
              <svg viewBox="0 0 260 360" role="img">
                <path d="M111 13 151 25 166 56 193 69 186 101 215 127 194 153 204 181 185 201 192 238 169 252 174 286 146 301 132 343 102 329 87 296 58 282 66 245 44 220 59 188 42 156 66 132 62 96 89 76 87 40Z" />
              </svg>
              <div class="marker marker--muenster">
                <span class="marker__arrow">↓</span>
                <span class="marker__icon">🚲</span>
              </div>
            </div>

            <p class="place__caption">Hier bin ich gerade.</p>
            <p class="continue-hint">Tippe irgendwo, um weiterzureisen <span>→</span></p>
          </article>

          <article class="place place--hokkaido" aria-label="Japan, Hokkaido">
            <div class="place__heading">
              <p class="place__kicker">Japan</p>
              <h2>Hokkaido</h2>
            </div>

            <div class="map map--hokkaido" aria-hidden="true">
              <svg viewBox="0 0 390 300" role="img">
                <path d="M23 152 54 124 88 120 105 91 142 84 171 43 202 67 224 105 262 101 281 70 314 89 306 122 350 131 370 160 343 182 302 180 281 212 245 207 224 241 191 229 168 260 137 239 127 207 91 214 66 190 34 189Z" />
              </svg>
              <div class="marker marker--hokkaido">
                <span class="marker__arrow">↓</span>
                <span class="marker__icon">🎃</span>
              </div>
            </div>

            <p class="place__caption">Da bist du gerade.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
